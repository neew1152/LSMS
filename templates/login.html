<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSMS - เข้าสู่ระบบ</title>
    <style>
        body { font-family: 'Sarabun', Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { color: #333; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .error { color: red; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>📚 ระบบห้องสมุด</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form action="/" method="POST">
            <input type="text" name="user_id" placeholder="รหัสผู้ใช้ (เช่น S01)" required autocomplete="off">
            <input type="password" name="pin" placeholder="รหัสผ่าน (PIN)" required>
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
    </div>

</body>
</html>
